<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Find All 34 Cats</title>
<style>
:root{--purple:#8b3fd1;--bg:#111}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif}body{color:#111;display:flex;justify-content:center}.page{width:min(1100px,100%);padding:16px}header{background:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:20;border-radius:10px;margin-bottom:12px}h1{font-size:clamp(22px,4vw,34px);margin:0 0 5px;font-weight:800}#counter{font-size:18px;font-weight:700}#message{margin-top:6px;font-weight:800;color:var(--purple);min-height:1.2em}.controls{display:flex;justify-content:center;gap:8px;margin:10px 0}button{border:0;border-radius:8px;padding:10px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111;touch-action:manipulation}button:active{transform:scale(.98)}#zoomLevel{align-self:center;color:#fff;font-size:14px;min-width:55px;text-align:center}.viewport{width:100%;overflow:auto;max-height:calc(100vh - 170px);background:#000;border-radius:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.stage{position:relative;width:1006px;height:719px;transform-origin:top left}.stage img.main{position:absolute;inset:0;width:1006px;height:719px;display:block;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;z-index:5;outline:none;border-radius:6px}.hotspot.found{pointer-events:none}.hotspot:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 5px var(--purple)}.cat-reveal{position:absolute;inset:0;width:1006px;height:719px;pointer-events:none;z-index:4}.instructions{color:#fff;text-align:center;font-size:14px;margin:10px 0 0}@media (max-width:600px){.page{padding:8px}.controls{margin:8px 0}.viewport{max-height:calc(100vh - 150px)}button{padding:9px 13px}}
</style>
</head>
<body>
<main class="page">
<header><h1>Find All 34 Cats</h1><div id="counter">0/34 Cats Found</div><div id="message" aria-live="polite"></div></header>
<div class="controls" aria-label="Zoom controls"><button type="button" id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLevel">100%</span><button type="button" id="zoomIn" aria-label="Zoom in">+</button></div>
<div class="viewport" id="viewport"><div class="stage" id="stage">
<img class="main" src="cat-background.jpg" width="1006" height="719" alt="Hidden cat puzzle">
<button class="hotspot" data-cat="1" style="left:403px;top:17px;width:46px;height:56px" aria-label="Cat 1"></button><button class="hotspot" data-cat="2" style="left:138px;top:58px;width:38px;height:50px" aria-label="Cat 2"></button><button class="hotspot" data-cat="3" style="left:868px;top:90px;width:77px;height:74px" aria-label="Cat 3"></button><button class="hotspot" data-cat="4" style="left:574px;top:109px;width:49px;height:52px" aria-label="Cat 4"></button><button class="hotspot" data-cat="5" style="left:551px;top:158px;width:30px;height:42px" aria-label="Cat 5"></button><button class="hotspot" data-cat="6" style="left:227px;top:167px;width:34px;height:32px" aria-label="Cat 6"></button><button class="hotspot" data-cat="7" style="left:47px;top:176px;width:36px;height:38px" aria-label="Cat 7"></button><button class="hotspot" data-cat="8" style="left:397px;top:179px;width:50px;height:51px" aria-label="Cat 8"></button><button class="hotspot" data-cat="9" style="left:755px;top:195px;width:53px;height:62px" aria-label="Cat 9"></button><button class="hotspot" data-cat="10" style="left:208px;top:215px;width:29px;height:41px" aria-label="Cat 10"></button><button class="hotspot" data-cat="11" style="left:0;top:245px;width:81px;height:67px" aria-label="Cat 11"></button><button class="hotspot" data-cat="12" style="left:903px;top:272px;width:69px;height:63px" aria-label="Cat 12"></button><button class="hotspot" data-cat="13" style="left:852px;top:279px;width:46px;height:46px" aria-label="Cat 13"></button><button class="hotspot" data-cat="14" style="left:255px;top:303px;width:36px;height:34px" aria-label="Cat 14"></button><button class="hotspot" data-cat="15" style="left:83px;top:325px;width:119px;height:61px" aria-label="Cat 15"></button><button class="hotspot" data-cat="16" style="left:777px;top:342px;width:85px;height:59px" aria-label="Cat 16"></button><button class="hotspot" data-cat="17" style="left:367px;top:368px;width:19px;height:40px" aria-label="Cat 17"></button><button class="hotspot" data-cat="18" style="left:513px;top:371px;width:41px;height:41px" aria-label="Cat 18"></button><button class="hotspot" data-cat="19" style="left:129px;top:390px;width:42px;height:41px" aria-label="Cat 19"></button><button class="hotspot" data-cat="20" style="left:700px;top:400px;width:71px;height:113px" aria-label="Cat 20"></button><button class="hotspot" data-cat="21" style="left:2px;top:422px;width:51px;height:53px" aria-label="Cat 21"></button><button class="hotspot" data-cat="22" style="left:414px;top:431px;width:23px;height:79px" aria-label="Cat 22"></button><button class="hotspot" data-cat="23" style="left:578px;top:445px;width:44px;height:59px" aria-label="Cat 23"></button><button class="hotspot" data-cat="24" style="left:451px;top:458px;width:58px;height:55px" aria-label="Cat 24"></button><button class="hotspot" data-cat="25" style="left:516px;top:493px;width:42px;height:50px" aria-label="Cat 25"></button><button class="hotspot" data-cat="26" style="left:285px;top:512px;width:36px;height:95px" aria-label="Cat 26"></button><button class="hotspot" data-cat="27" style="left:397px;top:535px;width:38px;height:67px" aria-label="Cat 27"></button><button class="hotspot" data-cat="28" style="left:145px;top:537px;width:44px;height:75px" aria-label="Cat 28"></button><button class="hotspot" data-cat="29" style="left:681px;top:558px;width:58px;height:58px" aria-label="Cat 29"></button><button class="hotspot" data-cat="30" style="left:888px;top:574px;width:40px;height:60px" aria-label="Cat 30"></button><button class="hotspot" data-cat="31" style="left:836px;top:578px;width:32px;height:55px" aria-label="Cat 31"></button><button class="hotspot" data-cat="32" style="left:2px;top:618px;width:44px;height:75px" aria-label="Cat 32"></button><button class="hotspot" data-cat="33" style="left:585px;top:624px;width:110px;height:62px" aria-label="Cat 33"></button><button class="hotspot" data-cat="34" style="left:187px;top:644px;width:71px;height:44px" aria-label="Cat 34"></button>
</div></div>
<p class="instructions">Tap or click each cat. Use + and − to zoom in and out.</p>
<audio id="meow" preload="auto"><source src="cat-meow.mp3" type="audio/mpeg"></audio>
</main>
<script>
(()=>{
const TOTAL=34;
const hotspots=[...document.querySelectorAll('.hotspot')];
const counter=document.getElementById('counter');
const message=document.getElementById('message');
const meow=document.getElementById('meow');
const stage=document.getElementById('stage');
const viewport=document.getElementById('viewport');
const zoomLevel=document.getElementById('zoomLevel');

let found=0,zoom=1,ready=false;
const W=1006,H=719;
let sourcePixels=null,labels=null,components=[],componentHotspots=[];

const purpleImage=new Image();
purpleImage.src='purple-cats.png';

function buildPurpleMap(){
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  ctx.drawImage(purpleImage,0,0,W,H);
  sourcePixels=ctx.getImageData(0,0,W,H).data;
  labels=new Int32Array(W*H);

  const queue=new Int32Array(W*H);
  let componentId=0;

  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const startIndex=y*W+x;
      if(labels[startIndex]!==0) continue;
      if(sourcePixels[startIndex*4+3]<12) continue;

      componentId++;
      let head=0,tail=0;
      queue[tail++]=startIndex;
      labels[startIndex]=componentId;

      let minX=x,maxX=x,minY=y,maxY=y;

      while(head<tail){
        const p=queue[head++];
        const px=p%W,py=(p/W)|0;

        if(px<minX)minX=px;
        if(px>maxX)maxX=px;
        if(py<minY)minY=py;
        if(py>maxY)maxY=py;

        for(let dy=-1;dy<=1;dy++){
          for(let dx=-1;dx<=1;dx++){
            if(dx===0&&dy===0)continue;
            const nx=px+dx,ny=py+dy;
            if(nx<0||nx>=W||ny<0||ny>=H)continue;
            const ni=ny*W+nx;
            if(labels[ni]!==0)continue;
            if(sourcePixels[ni*4+3]<12)continue;
            labels[ni]=componentId;
            queue[tail++]=ni;
          }
        }
      }

      components[componentId]={
        minX,minY,maxX,maxY
      };
    }
  }

  /*
    Some cats touch in the purple overlay and therefore form one
    connected component. Keep that component, but remember which
    hotspots belong to it so we can split it between the cats.
  */
  componentHotspots=Array.from({length:components.length},()=>[]);
  for(let id=1;id<components.length;id++){
    const box=components[id];
    for(const h of hotspots){
      const hx=parseFloat(h.style.left),hy=parseFloat(h.style.top);
      const hw=parseFloat(h.style.width),hh=parseFloat(h.style.height);
      if(box.maxX>=hx && box.minX<=hx+hw && box.maxY>=hy && box.minY<=hy+hh){
        componentHotspots[id].push(h);
      }
    }
  }

  ready=true;
  hotspots.forEach(h=>h.disabled=false);
}

purpleImage.onload=buildPurpleMap;

hotspots.forEach(h=>h.disabled=true);

function getComponentsForHotspot(button){
  const x=Math.max(0,Math.floor(parseFloat(button.style.left)));
  const y=Math.max(0,Math.floor(parseFloat(button.style.top)));
  const w=Math.ceil(parseFloat(button.style.width));
  const h=Math.ceil(parseFloat(button.style.height));
  const ids=new Set();

  for(let py=y;py<Math.min(H,y+h);py++){
    for(let px=x;px<Math.min(W,x+w);px++){
      const id=labels[py*W+px];
      if(id)ids.add(id);
    }
  }
  return [...ids];
}

function hotspotCenter(button){
  return {
    x:parseFloat(button.style.left)+parseFloat(button.style.width)/2,
    y:parseFloat(button.style.top)+parseFloat(button.style.height)/2
  };
}

function revealCat(button){
  if(!ready||button.classList.contains('found'))return;

  const ids=getComponentsForHotspot(button);

  if(!ids.length){
    return;
  }

  button.classList.add('found');
  found++;
  counter.textContent=`${found}/${TOTAL} Cats Found`;

  const canvas=document.createElement('canvas');
  canvas.className='cat-reveal';
  canvas.width=W;
  canvas.height=H;

  const ctx=canvas.getContext('2d');
  const out=ctx.createImageData(W,H);

  /*
    Copy only the purple pixels belonging to the component(s)
    touched by this cat's hotspot. The hotspot is therefore
    only the click target, not the reveal boundary.
  */
  for(const id of ids){
    const box=components[id];
    const candidates=componentHotspots[id]||[];
    const owners=candidates.length?candidates:[button];

    for(let py=box.minY;py<=box.maxY;py++){
      for(let px=box.minX;px<=box.maxX;px++){
        const p=py*W+px;
        if(labels[p]!==id)continue;

        /*
          If two cats touch and share one connected purple component,
          divide the component by distance to the individual hotspot
          centres. This keeps the cats separate without changing the
          background image or the clickable areas.
        */
        let owner=owners[0];
        let best=Infinity;
        let second=Infinity;
        for(const candidate of owners){
          const cc=hotspotCenter(candidate);
          const dx=px-cc.x,dy=py-cc.y;
          const d=dx*dx+dy*dy;
          if(d<best){
            second=best;
            best=d;
            owner=candidate;
          }else if(d<second){
            second=d;
          }
        }

        /*
          Leave a tiny transparent seam between touching cats. This
          prevents purple from bleeding across the boundary while
          preserving the full silhouette on either side.
        */
        if(owner!==button || (second-best)<25)continue;

        const s=p*4;
        out.data[s]=sourcePixels[s];
        out.data[s+1]=sourcePixels[s+1];
        out.data[s+2]=sourcePixels[s+2];
        out.data[s+3]=sourcePixels[s+3];
      }
    }
  }

  ctx.putImageData(out,0,0);
  stage.appendChild(canvas);

  try{
    meow.currentTime=0;
    const p=meow.play();
    if(p)p.catch(()=>{});
  }catch(_){}

  if(found===TOTAL){
    message.textContent='You found all 34 cats!';
  }
}

hotspots.forEach(h=>{
  h.addEventListener('click',()=>revealCat(h));
});

function setZoom(next){
  zoom=Math.max(.5,Math.min(3,next));
  stage.style.transform=`scale(${zoom})`;
  stage.style.marginRight=`${1006*(zoom-1)}px`;
  stage.style.marginBottom=`${719*(zoom-1)}px`;
  zoomLevel.textContent=`${Math.round(zoom*100)}%`;
}

document.getElementById('zoomIn')
  .addEventListener('click',()=>setZoom(zoom+.25));

document.getElementById('zoomOut')
  .addEventListener('click',()=>setZoom(zoom-.25));


})();
</script>
</body>
</html>
