<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Find All 34 Cats</title>
<style>
:root{--purple:#8b3fd1;--bg:#111}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,Helvetica,sans-serif}body{color:#111;display:flex;justify-content:center}.page{width:min(1100px,100%);padding:16px}header{background:#fff;padding:14px 16px;text-align:center;position:sticky;top:0;z-index:20;border-radius:10px;margin-bottom:12px}h1{font-size:clamp(22px,4vw,34px);margin:0 0 5px;font-weight:800}#counter{font-size:18px;font-weight:700}#message{margin-top:6px;font-weight:800;color:var(--purple);min-height:1.2em}.controls{display:flex;justify-content:center;gap:8px;margin:10px 0}button{border:0;border-radius:8px;padding:10px 15px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111;touch-action:manipulation}button:active{transform:scale(.98)}#zoomLevel{align-self:center;color:#fff;font-size:14px;min-width:55px;text-align:center}.viewport{width:100%;overflow:auto;max-height:calc(100vh - 170px);background:#000;border-radius:10px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.stage{position:relative;width:1006px;height:719px;transform-origin:top left}.stage img.main{position:absolute;inset:0;width:1006px;height:719px;display:block;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;padding:0;margin:0;border:0;background:transparent;cursor:pointer;z-index:5;outline:none;border-radius:3px}.hotspot.found{pointer-events:none}.hotspot:focus-visible{outline:none}.cat-reveal{position:absolute;left:0;top:0;width:1006px;height:719px;pointer-events:none;z-index:4}.instructions{color:#fff;text-align:center;font-size:14px;margin:10px 0 0}@media (max-width:600px){.page{padding:8px}.controls{margin:8px 0}.viewport{max-height:calc(100vh - 150px)}button{padding:9px 13px}}
</style>
</head>
<body>
<main class="page">
<header><h1>Find All 34 Cats</h1><div id="counter">0/34 Cats Found</div><div id="message" aria-live="polite"></div></header>
<div class="controls" aria-label="Zoom controls"><button type="button" id="zoomOut" aria-label="Zoom out">−</button><span id="zoomLevel">100%</span><button type="button" id="zoomIn" aria-label="Zoom in">+</button></div>
<div class="viewport" id="viewport"><div class="stage" id="stage">
<img class="main" src="cat-background.jpg" width="1006" height="719" alt="Hidden cat puzzle">
<button class="hotspot" data-cat="1" style="left:413px;top:17px;width:46px;height:56px" aria-label="Cat 1"></button><button class="hotspot" data-cat="2" style="left:148px;top:58px;width:38px;height:50px" aria-label="Cat 2"></button><button class="hotspot" data-cat="3" style="left:878px;top:90px;width:77px;height:74px" aria-label="Cat 3"></button><button class="hotspot" data-cat="4" style="left:584px;top:109px;width:49px;height:52px" aria-label="Cat 4"></button><button class="hotspot" data-cat="5" style="left:561px;top:158px;width:30px;height:42px" aria-label="Cat 5"></button><button class="hotspot" data-cat="6" style="left:237px;top:167px;width:34px;height:32px" aria-label="Cat 6"></button><button class="hotspot" data-cat="7" style="left:47px;top:176px;width:36px;height:38px" aria-label="Cat 7"></button><button class="hotspot" data-cat="8" style="left:407px;top:179px;width:50px;height:51px" aria-label="Cat 8"></button><button class="hotspot" data-cat="9" style="left:775px;top:195px;width:53px;height:62px" aria-label="Cat 9"></button><button class="hotspot" data-cat="10" style="left:218px;top:215px;width:29px;height:41px" aria-label="Cat 10"></button><button class="hotspot" data-cat="11" style="left:0;top:245px;width:81px;height:67px" aria-label="Cat 11"></button><button class="hotspot" data-cat="12" style="left:923px;top:272px;width:69px;height:63px" aria-label="Cat 12"></button><button class="hotspot" data-cat="13" style="left:867px;top:279px;width:46px;height:46px" aria-label="Cat 13"></button><button class="hotspot" data-cat="14" style="left:260px;top:303px;width:36px;height:34px" aria-label="Cat 14"></button><button class="hotspot" data-cat="15" style="left:83px;top:325px;width:119px;height:61px" aria-label="Cat 15"></button><button class="hotspot" data-cat="16" style="left:787px;top:342px;width:85px;height:59px" aria-label="Cat 16"></button><button class="hotspot" data-cat="17" style="left:377px;top:368px;width:19px;height:40px" aria-label="Cat 17"></button><button class="hotspot" data-cat="18" style="left:523px;top:371px;width:41px;height:41px" aria-label="Cat 18"></button><button class="hotspot" data-cat="19" style="left:129px;top:390px;width:42px;height:41px" aria-label="Cat 19"></button><button class="hotspot" data-cat="20" style="left:710px;top:400px;width:71px;height:113px" aria-label="Cat 20"></button><button class="hotspot" data-cat="21" style="left:2px;top:422px;width:51px;height:53px" aria-label="Cat 21"></button><button class="hotspot" data-cat="22" style="left:424px;top:431px;width:23px;height:79px" aria-label="Cat 22"></button><button class="hotspot" data-cat="23" style="left:588px;top:445px;width:44px;height:59px" aria-label="Cat 23"></button><button class="hotspot" data-cat="24" style="left:461px;top:458px;width:58px;height:55px" aria-label="Cat 24"></button><button class="hotspot" data-cat="25" style="left:526px;top:493px;width:42px;height:50px" aria-label="Cat 25"></button><button class="hotspot" data-cat="26" style="left:295px;top:512px;width:36px;height:95px" aria-label="Cat 26"></button><button class="hotspot" data-cat="27" style="left:407px;top:535px;width:38px;height:67px" aria-label="Cat 27"></button><button class="hotspot" data-cat="28" style="left:145px;top:537px;width:44px;height:75px" aria-label="Cat 28"></button><button class="hotspot" data-cat="29" style="left:691px;top:558px;width:58px;height:58px" aria-label="Cat 29"></button><button class="hotspot" data-cat="30" style="left:833px;top:579px;width:150px;height:60px" aria-label="Cat 30"></button><button class="hotspot" data-cat="32" style="left:12px;top:618px;width:44px;height:75px" aria-label="Cat 32"></button><button class="hotspot" data-cat="33" style="left:595px;top:624px;width:110px;height:62px" aria-label="Cat 33"></button><button class="hotspot" data-cat="34" style="left:187px;top:654px;width:71px;height:44px" aria-label="Cat 34"></button><button class="hotspot" data-cat="31" style="left:240px;top:415px;width:42px;height:50px" aria-label="Cat 31"></button>
</div></div>
<p class="instructions">Tap or click each cat. Use + and − to zoom in and out.</p>
<audio id="meow" preload="auto"><source src="cat-meow.mp3" type="audio/mpeg"></audio>
</main>
<script>
(()=>{
const TOTAL=34;
const hotspots=[...document.querySelectorAll('.hotspot')];
const counter=document.getElementById('counter');
const message=document.getElementById('message');
const meow=document.getElementById('meow');
const stage=document.getElementById('stage');
const zoomLevel=document.getElementById('zoomLevel');
let found=0,zoom=1;

// These are the 34 individual, full-canvas masks already uploaded to cat-game.
// The duplicate older "mug cat.png" is deliberately not used; the newer
// "mug cat test.png" is the mug mask being used for Cat 31.
const maskFiles=[
'cat above disco sign.png','cat behind cake.png','cat behind square on shelf on right.png','cat behind the sofa next to golf club.png','cat climbing up desk.png','cat coming out of circle on bookcase next to tent.png','cat hanging near pawprints on bookshelf.png','cat hiding in sofa arm next to penguin.png','cat hiding on computer chair.png','cat in computer screen.png','cat in elden ring photo.png','cat in mask.png','cat in shrek photo.png','cat in truck photo at the bottom of the photo.png','cat laying on back of sofa.png','cat laying on rug on the floor.png','cat laying on shelf above pc screen.png','cat licking paw.png','cat near creeper.png','cat near to picture of people.png','cat next to catan board game.png','cat next to dacshund.png','cat next to repo character.png','cat on bookcase near disco sign.png','cat on picture corner above pumpkins.png','cat sitting on floor bottom left.png','cat sleeping on floor near torch.png','cat top right.png','cat with just head sticking out from under table.png','laying in circle cat.png','mug cat test.png','pumpkin cat.png','table leg cat.png','wall head cat.png'
];

const masks=maskFiles.map(name=>({name,img:null,canvas:null,ctx:null,loaded:false}));
const remaining=new Set(masks.map((_,i)=>i));

function loadMask(mask){
 return new Promise(resolve=>{
  const img=new Image();
  img.onload=()=>{
   const canvas=document.createElement('canvas');canvas.width=1006;canvas.height=719;
   const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(img,0,0,1006,719);
   mask.img=img;mask.canvas=canvas;mask.ctx=ctx;mask.loaded=true;resolve(mask);
  };
  img.onerror=()=>resolve(mask);
  img.src=''+encodeURI(namePath(mask.name));
 });
}
function namePath(name){return './'+name.split('/').map(encodeURIComponent).join('/');}

Promise.all(masks.map(loadMask));

function purplePixel(r,g,b,a){
 if(a<30)return false;
 // Accept the purple used by the masks plus anti-aliased/shaded purple edges.
 return r>70 && b>100 && g<130 && b>g*1.35 && r>g*1.25;
}
function scoreMask(mask,x,y,w,h){
 if(!mask.loaded)return 0;
 const sx=Math.max(0,Math.floor(x)),sy=Math.max(0,Math.floor(y));
 const ex=Math.min(1006,Math.ceil(x+w)),ey=Math.min(719,Math.ceil(y+h));
 if(ex<=sx||ey<=sy)return 0;
 const data=mask.ctx.getImageData(sx,sy,ex-sx,ey-sy).data;
 let score=0;
 for(let i=0;i<data.length;i+=4)if(purplePixel(data[i],data[i+1],data[i+2],data[i+3]))score++;
 return score;
}
function chooseMask(button){
 const x=parseFloat(button.style.left),y=parseFloat(button.style.top),w=parseFloat(button.style.width),h=parseFloat(button.style.height);
 let best=-1,bestScore=0;
 for(const i of remaining){const s=scoreMask(masks[i],x,y,w,h);if(s>bestScore){bestScore=s;best=i;}}
 return best;
}
function showMask(mask){
 const img=document.createElement('img');
 img.className='cat-reveal';img.src=namePath(mask.name);img.width=1006;img.height=719;img.alt='';
 stage.appendChild(img);
}
function revealCat(button){
 if(button.classList.contains('found'))return;
 const maskIndex=chooseMask(button);
 if(maskIndex<0){
   // Still count the click, but do not create a wrong overlay.
   button.classList.add('found');found++;counter.textContent=`${found}/${TOTAL} Cats Found`;
 }else{
   remaining.delete(maskIndex);button.classList.add('found');found++;counter.textContent=`${found}/${TOTAL} Cats Found`;showMask(masks[maskIndex]);
 }
 try{meow.currentTime=0;const p=meow.play();if(p)p.catch(()=>{});}catch(_){}
 if(found===TOTAL)message.textContent='You found all 34 cats!';
}
hotspots.forEach(h=>h.addEventListener('click',()=>revealCat(h)));
function setZoom(next){zoom=Math.max(.5,Math.min(3,next));stage.style.transform=`scale(${zoom})`;stage.style.marginRight=`${1006*(zoom-1)}px`;stage.style.marginBottom=`${719*(zoom-1)}px`;zoomLevel.textContent=`${Math.round(zoom*100)}%`}
document.getElementById('zoomIn').addEventListener('click',()=>setZoom(zoom+.25));
document.getElementById('zoomOut').addEventListener('click',()=>setZoom(zoom-.25));
})();
</script>
</body>
</html>
