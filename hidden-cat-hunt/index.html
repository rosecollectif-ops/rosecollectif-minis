<script>
(()=>{const root=document.querySelector('main');if(!root||root.dataset.ready)return;root.dataset.ready='1';const targets=[...root.querySelectorAll('.cat-target')],overlays=[...root.querySelectorAll('.found-cat')],status=root.querySelector('#status'),message=root.querySelector('#message'),reset=root.querySelector('#reset');let found=new Set(),audioCtx=null;function getAudio(){if(!audioCtx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;audioCtx=new C()}if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});return audioCtx}function meow(){const ctx=getAudio();if(!ctx)return;const now=ctx.currentTime,gain=ctx.createGain();gain.gain.setValueAtTime(.0001,now);gain.gain.exponentialRampToValueAtTime(.22,now+.025);gain.gain.exponentialRampToValueAtTime(.0001,now+.38);gain.connect(ctx.destination);const osc=ctx.createOscillator();osc.type='triangle';osc.frequency.setValueAtTime(520,now);osc.frequency.exponentialRampToValueAtTime(820,now+.13);osc.frequency.exponentialRampToValueAtTime(360,now+.34);osc.connect(gain);osc.start(now);osc.stop(now+.4);const osc2=ctx.createOscillator(),g2=ctx.createGain();g2.gain.setValueAtTime(.0001,now);g2.gain.exponentialRampToValueAtTime(.07,now+.02);g2.gain.exponentialRampToValueAtTime(.0001,now+.3);osc2.type='sine';osc2.frequency.setValueAtTime(760,now);osc2.frequency.exponentialRampToValueAtTime(500,now+.3);osc2.connect(g2).connect(ctx.destination);osc2.start(now);osc2.stop(now+.32)}function update(){const left=34-found.size;status.innerHTML=left===0?'<strong>0</strong> cats left':`<strong>${left}</strong> ${left===1?'cat':'cats'} left`;if(left===0){message.classList.add('show');reset.classList.add('show')}}function findCat(t){const id=Number(t.dataset.cat);if(!Number.isInteger(id)||found.has(id))return;found.add(id);const o=root.querySelector(`.found-cat[data-cat="${id}"]`);if(o)o.classList.add('found');t.setAttribute('aria-label',`Cat ${id} found`);t.setAttribute('aria-pressed','true');meow();update()}targets.forEach(t=>{t.addEventListener('click',()=>findCat(t));t.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();findCat(t)}})});reset.addEventListener('click',()=>{found.clear();overlays.forEach(o=>o.classList.remove('found'));targets.forEach(t=>t.setAttribute('aria-pressed','false'));message.classList.remove('show');reset.classList.remove('show');update()})})();
</script>
