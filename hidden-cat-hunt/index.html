<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Find All 34 Cats</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:Helvetica,Arial,sans-serif}main{width:min(100%,1400px);margin:auto;padding:0 8px 28px}.game{position:relative;width:100%;line-height:0}iframe{display:block;width:100%;height:auto;aspect-ratio:1754/1240;border:0;background:#080808}#below{text-align:center;padding:14px 8px 0;line-height:1.3}#below h1{font-size:clamp(1.3rem,3.5vw,2rem);margin:0;font-weight:700}#complete{display:none;margin-top:10px;font-weight:700;color:#c58bea}#complete.show{display:block}button{display:none;margin:12px auto 0;padding:10px 18px;border:0;border-radius:999px;background:#8b3fd1;color:#fff;font:inherit;font-weight:700;cursor:pointer}button.show{display:block}</style></head><body><main><div class="game"><iframe id="gameFrame" src="./game-core.html?v=7" title="Find all 34 cats"></iframe></div><div id="below"><h1>Find all 34 cats!</h1><div id="complete">You found them all!</div><button id="reset" type="button">Play again</button></div><audio id="meow" preload="auto" src="../assets/sound_garage-cat-meow-8-fx-306184.mp3"></audio></main><script>(()=>{const frame=document.querySelector('#gameFrame'),complete=document.querySelector('#complete'),reset=document.querySelector('#reset'),meow=document.querySelector('#meow');let found=new Set();function playMeow(){meow.currentTime=0;meow.play().catch(()=>{})}function update(){if(found.size===34){complete.classList.add('show');reset.classList.add('show')}}function setup(){const doc=frame.contentDocument;if(!doc)return;const style=doc.createElement('style');style.textContent='.cat-target{outline:none!important}.cat-target:focus{stroke:transparent!important;stroke-width:0!important;stroke-dasharray:none!important}#counter{display:none!important}.below{padding-top:14px!important}';doc.head.appendChild(style);const targets=[...doc.querySelectorAll('.cat-target')];targets.forEach(t=>{t.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();const id=t.dataset.cat;if(found.has(id))return;found.add(id);doc.querySelector('#purple'+id)?.classList.add('found');t.blur();playMeow();update()},true)});reset.onclick=()=>{found.clear();location.reload()};update()}frame.addEventListener('load',setup)})();</script></body></html>
