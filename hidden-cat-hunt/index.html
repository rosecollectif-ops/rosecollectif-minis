<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Find All 34 Cats</title><style>*{box-sizing:border-box}html,body{margin:0;background:#080808;color:#fff;font-family:Helvetica,Arial,sans-serif}main{width:min(100%,1400px);margin:auto;padding:0 8px 28px}.game{position:relative;width:100%;line-height:0}iframe{display:block;width:100%;height:auto;aspect-ratio:1754/1240;border:0;background:#080808}#counter{position:absolute;z-index:5;top:3.3%;left:1.8%;width:7.2%;height:8.2%;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#176f68;font-weight:700;line-height:1}#counter .number{font-size:clamp(18px,3.2vw,42px)}#counter .cats{font-size:clamp(9px,1.4vw,18px);letter-spacing:.04em;margin-top:2px}#below{text-align:center;padding:14px 8px 0;line-height:1.3}#below h1{font-size:clamp(1.3rem,3.5vw,2rem);margin:0;font-weight:700}#complete{display:none;margin-top:10px;font-weight:700;color:#c58bea}#complete.show{display:block}button{display:none;margin:12px auto 0;padding:10px 18px;border:0;border-radius:999px;background:#8b3fd1;color:#fff;font:inherit;font-weight:700;cursor:pointer}button.show{display:block}</style></head><body><main><div class="game"><iframe id="gameFrame" src="./game-core.html?v=7" title="Find all 34 cats"></iframe><div id="counter"><span class="number">34</span><span class="cats">CATS</span></div></div><div id="below"><h1>Find all 34 cats!</h1><div id="complete">You found them all!</div><button id="reset" type="button">Play again</button></div><audio id="meow" preload="auto" src="../assets/meow.wav"></audio></main><script>(()=>{const frame=document.querySelector('#gameFrame'),counter=document.querySelector('#counter .number'),complete=document.querySelector('#complete'),reset=document.querySelector('#reset'),meow=document.querySelector('#meow');let found=new Set();function playMeow(){meow.currentTime=0;meow.play().catch(()=>{})}function update(){const left=34-found.size;counter.textContent=left;if(left===0){complete.classList.add('show');reset.classList.add('show')}}function setup(){const doc=frame.contentDocument;if(!doc)return;const svg=doc.querySelector('svg');if(!svg)return;const style=doc.createElement('style');style.textContent='.cat-target{outline:none!important}.cat-target:focus{stroke:transparent!important;stroke-width:0!important;stroke-dasharray:none!important}#counter{display:none!important}.below{padding-top:14px!important}';doc.head.appendChild(style);const cp=doc.querySelector('#cat12');const cpPath=cp&&cp.querySelector('path');const target12=doc.querySelector('.cat-target[data-cat="12"]');if(cpPath&&target12){const parts=(cpPath.getAttribute('d').match(/M[^M]+/g)||[]);if(parts.length>=3){const first=parts.slice(0,2).join(' '),second=parts.slice(2).join(' ');cpPath.setAttribute('d',first);target12.setAttribute('d',first);const newCp=doc.createElementNS('http://www.w3.org/2000/svg','clipPath');newCp.id='cat35';const p=doc.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',second);newCp.appendChild(p);cp.parentNode.appendChild(newCp);const source=doc.querySelector('#purple12');const purple35=source.cloneNode(true);purple35.id='purple35';purple35.setAttribute('clip-path','url(#cat35)');source.parentNode.appendChild(purple35);const newTarget=doc.createElementNS('http://www.w3.org/2000/svg','path');newTarget.setAttribute('class','cat-target');newTarget.dataset.cat='35';newTarget.setAttribute('d',second);newTarget.setAttribute('tabindex','0');newTarget.setAttribute('role','button');newTarget.setAttribute('aria-label','Find cat 35');doc.querySelector('#targets').appendChild(newTarget)}}const targets=[...doc.querySelectorAll('.cat-target')];targets.forEach(t=>{t.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();const raw=Number(t.dataset.cat);const logical=(raw===30||raw===31)?30:raw;if(found.has(logical))return;found.add(logical);if(logical===30){doc.querySelector('#purple30')?.classList.add('found');doc.querySelector('#purple31')?.classList.add('found')}else{doc.querySelector('#purple'+raw)?.classList.add('found')}t.blur();playMeow();update()},true)});reset.onclick=()=>{found.clear();location.reload()};update()}frame.addEventListener('load',setup)})();</script></body></html>
